name: build

on:
  push:
    paths:
      - "*.md"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          gem install kramdown-rfc2629 --no-document
          pip install xml2rfc

      - name: Build outputs
        run: |
          mkdir -p build
          for md in draft-*.md; do
            base="${md%.md}"
            kdrfc -3 -h "$md"
            mv "$base.xml" "$base.html" "$base.txt" build/
          done

      - name: Check for broken references
        run: |
          if grep -rl "BROKEN REFERENCE" build/; then
            echo "::error::Broken reference in generated output (reference fetch failed?)"
            exit 1
          fi

      - name: Commit build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build
          if git diff --cached --quiet; then
            echo "No build changes."
          else
            git commit -m "Rebuild outputs [skip ci]"
            git push
          fi
